# How narration says this book's terms. [terms] are exact and case-sensitive, and win over the shared rules;
# [words] are whole words in any case, such as the words of an example's ID.

[terms]
# names and abbreviations
"WANDS" = "Wands"
"ECIR" = "E C I R"
"BPE" = "B P E"
"KenLM" = "Ken L M"
"word2vec" = "word to vec"

# SmolLM2's tokenizer writes a space before a word as a G with a dot above
"Ġ" = "G-dot"
"Ġtable" = "G-dot table"
"Ġsled" = "G-dot sled"

# the markers a model's text is padded with
"<s>" = "start marker"
"</s>" = "end marker"
"<unk>" = "unk"
"</w>" = " end-of-word"
"<|endoftext|>" = "end of text"
"<s> coffee" = "start marker, coffee"
"table </s>" = "table, end marker"

# code read as a listener needs it
"&" = "ampersand"
"bar & counter stools" = "bar and counter stools"
"6, . and 5" = "six, a dot, and five"
"''" = "two apostrophes"

# paths and modules: a reading inside a path is given for the whole path, so its dots and slashes are read too
"examples/data/wands-text/README.md" = "examples slash data slash wands text slash read me dot M D"
"examples/data/smollm2-tokenizer/" = "examples slash data slash smol L M two tokenizer"
"prep/smollm2_tokenizer.py" = "prep slash smol L M two tokenizer dot py"
"lib.bpe" = "lib dot B P E"
"lib.ngrams" = "lib dot N-grams"
"lib.vectors.svd_vectors" = "lib dot vectors dot S V D vectors"
"lib.skipgram" = "lib dot skip-gram"
"lib.skipgram.step" = "lib dot skip-gram dot step"
"lib.skipgram.train" = "lib dot skip-gram dot train"
"recordings/skipgram.py" = "recordings slash skip-gram dot py"
"recordings/neural_lm.py" = "recordings slash neural L M dot py"
"lib.tinynet" = "lib dot tiny net"
"lib.bpe.train" = "lib dot B P E dot train"
"lib.bpe.store_tokenizer()" = "lib dot B P E dot store tokenizer"

# formulas written in the prose, chapter 1
"P(v | w) = count(w v) / count(w)" = "P of v given w equals the count of w v, divided by the count of w"
"cross-entropy = −(1/N) Σ log P(next word | previous word)" = "cross-entropy equals minus one over N, times the sum of log P of the next word given the previous word"
"perplexity = exp(cross-entropy)" = "perplexity equals e to the power of the cross-entropy"
"P(v | w) = (count(w v) + 1) / (count(w) + V)" = "P of v given w equals the count of w v plus one, divided by the count of w plus V"

# formulas written in the prose, chapter 3
"P(token | a b) = λ₃ · P₃(token | a b) + λ₂ · P₂(token | b) + λ₁ · P₁(token)" = "P of token given a b equals lambda three times P three of token given a b, plus lambda two times P two of token given b, plus lambda one times P one of token"
"P(w | h) = max(c(h w) − d, 0) / c(h) + d · N(h) / c(h) · P(w | shorter h)" = "P of w given h equals the larger of zero and c of h w minus d, divided by c of h, plus d times N of h over c of h, times P of w given the shorter h"
"D = n₁ / (n₁ + 2 n₂)" = "D equals n one, divided by n one plus two times n two"
"c(h w)" = "c of h w"
"c(h)" = "c of h"
"N(h)" = "N of h"

# formulas written in the prose, chapter 4
"PMI(a, b) = log [ P(a, b) / (P(a) · P(b)) ]" = "P M I of a and b equals the log of P of a and b, divided by P of a times P of b"
"P(a, b)" = "P of a and b"
"P(a)" = "P of a"
"P(b)" = "P of b"
"σ(s) = 1 / (1 + e⁻ˢ)" = "sigma of s equals one over one plus e to the minus s"
"L = −log σ(v·u) − Σₙ log σ(−v·uₙ)" = "L equals minus log sigma of v dot u, minus the sum over the noise tokens of log sigma of minus v dot u n"
"σ(v·u)" = "sigma of v dot u"
"σ(v·uₙ)" = "sigma of v dot u n"
"σ(0)" = "sigma of zero"

# formulas written in the prose, chapter 5
"h = tanh(xW + b)" = "h equals tan h of x W, plus b"
"z = hU + c" = "z equals h U, plus c"
"P(token i) = exp(zᵢ) / Σⱼ exp(zⱼ)" = "P of token i equals e to the z i, divided by the sum over j of e to the z j"
"L = −log P(next token)" = "L equals minus log P of the next token"
"∂L/∂w" = "d L by d w"

